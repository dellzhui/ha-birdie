<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to Birdie</title>
<link rel="stylesheet" href="/oauth/static/signin.css">
<script src="/oauth/static/signin.js" defer></script>
</head>
<body>
<main id="app" data-request-id="{{request_id}}" data-method="{{method}}">
  <h1>Birdie</h1>
  <p id="dev-banner" class="banner" hidden>Development sign-in. Not for real accounts.</p>

  <section id="sign-in">
    <p><strong>{{client_name}}</strong> wants to connect to your Birdie account.</p>
    <form id="password-form">
      <label>E-mail address
        <input type="email" name="email" autocomplete="username" required>
      </label>
      <label>Password
        <input type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit">Sign in</button>
    </form>
  </section>

  <section id="consent" hidden>
    <p>Signed in as <strong id="account"></strong>.</p>
    <p><strong>{{client_name}}</strong> will be able to see and control your Birdie devices.</p>
    <div class="actions">
      <button type="button" id="allow">Allow</button>
      <button type="button" id="deny" class="secondary">Cancel</button>
    </div>
  </section>

  <p id="message" role="alert" hidden></p>
</main>
</body>
</html>

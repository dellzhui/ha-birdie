[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "birdie-bridge"
version = "0.1.0"
description = "Birdie cloud bridge: Tuya Cloud access for the Birdie Home Assistant integration"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
dependencies = ["aiohttp>=3.10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff", "mypy"]

[project.scripts]
birdie-tuya = "birdie_bridge.devtool:main"

[tool.setuptools.packages.find]
include = ["birdie_bridge*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]

[tool.mypy]
strict = true
python_version = "3.13"
